services:
  - type: web
    name: intelligeo-app
    runtime: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22

autoDeploy: true
